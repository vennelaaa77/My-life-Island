<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Life Island</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: full-window stage (3D iso city / 2D street / 2D rooms) + pixel HUD; boards are pinned-paper sheets */
:root{
  --night:#150f24; --plum:#241a38; --plum2:#33264d; --line:#4b3a6b;
  --gold:#f2c063; --gold2:#c98a2c; --rose:#f08aa0; --teal:#4fb3a9; --cream:#f6e7cf; --mute:#b9a8d6;
  --paper:#efe0bf; --paper2:#e4d1a8; --ink:#2b1d14; --ink2:#6b5440; --late:#a8322b;
  --px:"Pixelify Sans", "Courier New", monospace;
  color-scheme: dark;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
body{background:var(--night);color:var(--cream);font-family:var(--px);font-size:17px;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
kbd{font:inherit;font-size:11px;padding:0 4px;border:1px solid currentColor;opacity:.7;margin-left:4px}

#sky{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 120%,#3a2754 0%,#1b1430 55%,#100b1c 100%)}
#sky i{position:absolute;width:2px;height:2px;background:#fff;animation:tw 3s ease-in-out infinite}
#sky .moon{position:absolute;right:9%;top:9%;width:34px;height:34px;border-radius:50%;box-shadow:-9px 4px 0 0 #fff4d6}
@keyframes tw{50%{opacity:.25}}
#city{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
#street{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;display:block;background:#000}
#labels{position:fixed;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;border:2px solid var(--line);background:rgba(36,26,56,.92);color:var(--cream);padding:4px 10px;font-size:15px;white-space:nowrap;box-shadow:0 3px 0 #0b0714;display:flex;gap:6px;align-items:center}
.lbl:hover,.lbl.hot{border-color:var(--gold);color:#fff}
.lbl.soon{opacity:.6}
.mk{width:9px;height:9px;background:var(--gold);transform:rotate(45deg);display:inline-block;flex:none}
.mk.new{animation:pulse 1s steps(2) infinite;box-shadow:0 0 8px 2px var(--gold)}
.mk.seen{background:#8d7a5a}
@keyframes pulse{50%{transform:rotate(45deg) scale(1.5)}}

/* HUD */
.hud{position:fixed;z-index:20;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.hud>*{pointer-events:auto}
.box{background:var(--plum);border:3px solid var(--line);box-shadow:inset 0 0 0 2px #1a1229,0 4px 0 #0b0714}
.who{display:flex;gap:10px;align-items:center;padding:6px 12px 6px 6px}
.who canvas{width:44px;height:44px;background:#3a2b55;border:2px solid var(--gold2)}
.lvl{font-weight:700;font-size:17px;color:var(--gold)}
.bar{width:150px;height:7px;background:#120c1f;border:2px solid #120c1f;margin-top:3px}
.bar i{display:block;height:100%;background:var(--teal)}
.bar.day i{background:var(--gold)}
.xp{font-size:11px;color:var(--mute);margin-top:1px}
.right{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}
.purse{display:flex;gap:8px;align-items:center;padding:8px 14px;font-size:20px;font-weight:700;color:var(--gold)}
.coin{width:16px;height:16px;background:var(--gold);border:2px solid var(--gold2);box-shadow:inset -3px -3px 0 var(--gold2);flex:none;display:inline-block;vertical-align:middle}
.hbtn{padding:8px 12px;min-height:44px;color:var(--cream)}
.hbtn:hover{color:var(--gold)}
.mwrap{position:relative}
.mmenu{position:absolute;right:0;top:52px;width:300px;padding:12px 14px;z-index:5}
.mtitle{color:var(--gold);font-weight:700}
.mopt{width:100%;text-align:left;background:var(--plum2);border:2px solid var(--line);padding:8px 10px;margin-top:6px;min-height:42px}
.mhelp{font-size:12px;color:var(--mute);line-height:1.45;margin:6px 0}
.mmenu form{display:flex;gap:6px}
.mmenu input{flex:1;min-width:0;background:#1a1229;border:2px solid var(--line);padding:6px 8px;color:var(--cream)}
.linkbtn{display:block;text-align:center;text-decoration:none;margin-top:8px}

.hint{position:fixed;z-index:15;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:8px 14px;font-size:14px;color:var(--mute);white-space:nowrap}
.enter{position:fixed;z-index:16;left:50%;transform:translateX(-50%);top:calc(96px + env(safe-area-inset-top,0px));padding:10px 18px;background:var(--gold);color:#2a1a08;border:3px solid #fff2c8;box-shadow:0 4px 0 var(--gold2);font-weight:700;font-size:18px;animation:bob 1.2s steps(2) infinite}
@keyframes bob{50%{transform:translate(-50%,-3px)}}

.quests{position:fixed;z-index:15;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100vw - 24px));padding:12px 14px;max-height:46vh;overflow:auto}
.quests h2{margin:0 0 6px;font-size:18px;color:var(--gold);display:flex;justify-content:space-between;align-items:baseline}
.quests h2 small{color:var(--mute);font-size:13px;font-weight:400}
.late{color:var(--rose)}
.qrow{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:2px dashed var(--line);padding:7px 2px;font-size:14px}
.qrow:first-of-type{border-top:0}
.qrow:hover{color:var(--gold)}
.qt{display:flex;flex-direction:column;min-width:0}
.qt em{font-style:normal;font-size:11px;color:var(--mute)}
.dot{width:8px;height:8px;background:var(--gold);flex:none}.dot.seen{background:#8d7a5a}.dot.overdue{background:var(--rose)}
.qrow .where{margin-left:auto;color:var(--mute);font-size:12px;white-space:nowrap}
.legend{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--mute);margin-top:8px;padding-top:8px;border-top:2px solid var(--line)}
.lg{width:8px;height:8px;display:inline-block;transform:rotate(45deg);margin-right:5px;background:var(--gold)}.lg.seen{background:#8d7a5a}
.legend .ghost{margin-left:auto}

/* boards: pinned paper */
.panel{position:fixed;z-index:30;top:calc(96px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100vw - 24px));display:flex;flex-direction:column}
.panel.wide{left:50%;right:auto;transform:translateX(-50%);width:min(760px,calc(100vw - 24px))}
.paper{background:var(--paper);color:var(--ink);border:4px solid #5a3a22;box-shadow:inset 0 0 0 3px var(--paper2),0 6px 0 #1a0f08,0 0 0 2px #1a0f08}
.paper header{padding:14px 18px 10px;border-bottom:3px dashed #b9a07a;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.paper h1{margin:0;font-size:26px;color:#5a2a14;line-height:1.05}
.paper .sub{color:var(--ink2);font-size:14px;margin-top:4px}
.paper .body{padding:12px 14px 18px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:8px}
.x{background:#5a3a22;color:var(--paper);border:0;padding:8px 10px;min-height:40px;white-space:nowrap}
.section-label{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#7a4a1c;margin:10px 2px 0;font-weight:700}
.section-label.overdue{color:var(--late)}
.card{display:flex;align-items:center;gap:10px;background:#fbf2dc;border:2px solid #c9b088;padding:10px 12px;box-shadow:0 2px 0 #c9b088}
.card.overdue{border-color:#d98a80;background:#fbe6df}
.card.done{opacity:.6}
.card .grow{flex:1;min-width:0}
.card .t{font-size:16px;font-weight:600;color:var(--ink)}
.card .m{font-size:12px;color:var(--ink2);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card.locked{opacity:.65}
.when{font-weight:600}
.card.overdue .when{color:var(--late)}
.tag{font-size:11px;padding:1px 6px;background:#e9d7b0;border:1px solid #c9b088;color:var(--ink2);font-weight:600;vertical-align:middle}
.tag.overdue{color:#fff;background:var(--late);border-color:var(--late)}
.tag.new{color:#2a1a08;background:var(--gold);border-color:var(--gold2)}
.tag.ok{color:#fff;background:#3f7d55;border-color:#3f7d55}
.chip{font-size:11px;background:#5a3a22;color:var(--paper);border:0;padding:2px 8px}
.reward{display:flex;flex-direction:column;align-items:flex-end;color:#7a4a1c;font-weight:700;white-space:nowrap}
.reward small{font-size:11px;color:var(--ink2);font-weight:500}
.reward .coin{width:12px;height:12px;margin-right:4px}
.sell{background:var(--teal);color:#0d2422;border:2px solid #9be3da;box-shadow:0 3px 0 #2c7068;padding:8px 14px;min-height:42px;font-weight:700;white-space:nowrap}
.sell:hover{filter:brightness(1.08)}
.sell[disabled]{opacity:.4;cursor:not-allowed}
.ghost{background:none;border:2px solid #b9a07a;color:var(--ink2);padding:6px 10px;min-height:40px}
.box .ghost{border-color:var(--line);color:var(--mute)}
.icon-btn{background:none;border:0;min-width:36px;min-height:40px;opacity:.55}
.icon-btn:hover{opacity:1}
.note-link{font-size:12px;color:#2c6a6e;text-decoration:underline}
.empty{text-align:center;color:var(--ink2);padding:14px 8px}
.note-pin{background:#fff6d8;border:2px dashed #c98a2c;padding:10px 12px;font-size:14px}
.howto{background:#fbf2dc;border:2px solid #c9b088;padding:8px 12px;font-size:14px}
.howto summary{cursor:pointer;font-weight:700;color:#5a2a14}
.howto ul{margin:8px 0 2px;padding-left:18px;line-height:1.5}
.goal{background:#fbf2dc;border:2px solid #c9b088;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.goal>.t{font-size:18px;font-weight:700}.goal>.t small{font-size:12px;color:var(--ink2);font-weight:500}
.portrait{text-align:center;padding:10px}
.portrait .frame{width:140px;height:170px;margin:10px auto;border:8px solid #c98a2c;background:#3a2b55;display:grid;place-items:center;font-size:44px;color:var(--gold);box-shadow:0 4px 0 #7a4a1c}
.portrait h2{margin:6px 0;color:#5a2a14}
.portrait .mhelp{color:var(--ink2)}
.paper .mhelp{color:var(--ink2)}
form.add{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:2px dashed #b9a07a;padding:10px}
form.add.mini{display:flex;border:0;padding:0}
form.add.mini input{flex:1;min-width:0}
form.add label{font-size:12px;color:var(--ink2);display:flex;flex-direction:column;gap:4px;font-weight:600}
form.add .full{grid-column:1/-1}
form.add input,form.add select{background:#fffaf0;border:2px solid #c9b088;padding:8px;min-height:40px;color:var(--ink)}
.days{display:flex;gap:6px;flex-wrap:wrap}.days label{flex-direction:row!important;align-items:center}

#fade{position:fixed;inset:0;background:#0b0714;z-index:40;opacity:0;pointer-events:none;transition:opacity .32s steps(6)}
#fade.on{opacity:1}
.toast{position:fixed;z-index:50;left:50%;top:calc(96px + env(safe-area-inset-top,0px));transform:translate(-50%,-10px);opacity:0;padding:10px 16px;display:flex;gap:8px;align-items:center;transition:.25s steps(4);pointer-events:none;color:var(--gold);max-width:calc(100vw - 24px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.flycoin{position:fixed;z-index:60;width:12px;height:12px;background:var(--gold);border:2px solid var(--gold2);pointer-events:none}

/* title: the city turns slowly behind the logo */
#title{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(180deg,rgba(11,7,20,.75),rgba(11,7,20,.15) 40%,rgba(11,7,20,.15) 60%,rgba(11,7,20,.85));transition:opacity .45s steps(5)}
#title.gone{opacity:0;pointer-events:none}
.logo{margin:0;font-size:clamp(44px,9vw,104px);line-height:.9;color:var(--gold);text-shadow:5px 5px 0 #8a3a5a,10px 10px 0 #2a1638;letter-spacing:.04em;text-align:center}
.tagline{color:var(--cream);font-size:18px;letter-spacing:.2em;text-transform:uppercase;opacity:.85}
#start{margin-top:26px;background:none;border:0;color:var(--cream);font-size:20px;animation:blink 1.1s steps(2) infinite;padding:12px 18px;min-height:44px}
@keyframes blink{50%{opacity:.25}}
.credits{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--mute);text-align:center;opacity:.8}
#loading{position:fixed;z-index:71;left:50%;top:62%;transform:translateX(-50%);font-size:13px;color:var(--mute)}


/* red location pins over the city; names only when zoomed in */
.pin3{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.pinhead{position:relative;width:22px;height:22px;background:#e2433b;border:3px solid #fff3e6;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:2px 3px 0 rgba(10,5,20,.45);order:2}
.pinhead::after{content:"";position:absolute;left:5px;top:5px;width:6px;height:6px;background:#fff3e6;border-radius:50%}
.pin3.soon .pinhead{background:#8a7a90}
.pin3:hover .pinhead,.pin3.hot .pinhead{background:#ff5a4f;transform:rotate(-45deg) scale(1.15)}
.badge{position:absolute;right:-12px;top:-12px;transform:rotate(45deg);min-width:16px;height:16px;padding:0 3px;font-style:normal;font-size:10px;line-height:16px;text-align:center;background:var(--gold);color:#2a1a08;border:2px solid #fff3e6;font-weight:700}
.badge.new{animation:pulse2 1s steps(2) infinite;box-shadow:0 0 8px 2px var(--gold)}
.badge.seen{background:#c9b48a}
@keyframes pulse2{50%{transform:rotate(45deg) scale(1.25)}}
.pinname{order:1;opacity:0;transform:translateY(4px);transition:.2s steps(3);background:rgba(36,26,56,.94);border:2px solid var(--line);color:var(--cream);padding:3px 9px;font-size:14px;white-space:nowrap;pointer-events:none}
.pin3.named .pinname{opacity:1;transform:none}
.pin3.hot .pinname{border-color:var(--gold)}
.focus{position:fixed;z-index:22;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:16px;align-items:center;padding:12px 14px 12px 18px;max-width:calc(100vw - 24px)}
.focus .ft{font-size:22px;color:var(--gold);font-weight:700}.focus .fs{font-size:13px;color:var(--mute)}
.focus .fb{display:flex;gap:8px}
.zoomctl{position:fixed;z-index:15;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;align-items:center;padding:6px}
.zoomctl button{width:40px;height:40px;background:var(--plum2);border:2px solid var(--line);font-size:18px}
.zoomctl button:hover{color:var(--gold)}
.zhelp{font-size:11px;color:var(--mute);padding:0 6px;max-width:160px}
.minbtn{background:none;border:0;color:var(--gold);font-weight:700;font-size:18px;padding:0;min-height:32px}
.quests.min{width:auto;padding:8px 12px}.quests.min h2{margin:0;gap:14px}
.hbtns{display:flex;gap:6px}
.panel.min{bottom:auto}.panel.min .body{display:none}.panel.min header{border-bottom:0}
.lg.red{background:#e2433b;border-radius:50%;transform:none}
@media (max-width:760px){ .zhelp{display:none} .focus{bottom:calc(64px + env(safe-area-inset-bottom,0px))} }

/* ===== boards v2: dark glass app (Venn's reference) with game touches ===== */
.paper{--serif:"Fraunces", Georgia, serif; --sans:"DM Sans", "Segoe UI", system-ui, sans-serif;
  background:linear-gradient(180deg,rgba(24,26,36,.94),rgba(18,19,28,.96));backdrop-filter:blur(14px);color:#ece6da;font-family:var(--sans);
  border:1px solid rgba(255,255,255,.12);border-radius:26px;box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);overflow:hidden}
.paper header{padding:20px 22px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.paper .eyebrow{font-family:var(--px);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#d9b25a}
.paper h1{font-family:var(--serif);font-weight:700;font-size:34px;color:#f4ecdc;line-height:1.05;letter-spacing:-.01em;margin-top:4px}
.paper .spark{color:var(--gold);font-size:20px;margin-left:8px;vertical-align:middle;display:inline-block;animation:spark 2.4s ease-in-out infinite}
@keyframes spark{50%{transform:scale(1.25) rotate(20deg);opacity:.7}}
.paper .sub{color:#a9a4b5;font-size:14px}
.paper .x{background:rgba(255,255,255,.04);color:#e6dfd2;border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:8px 12px;font-family:var(--sans)}
.paper .x:hover{border-color:var(--gold);color:var(--gold)}
.paper .body{padding:14px 18px 22px;gap:10px}
.paper .section-label{display:flex;align-items:center;gap:12px;font-family:var(--serif);text-transform:none;letter-spacing:0;font-size:20px;color:#f1e9da;margin:12px 2px 2px}
.paper .section-label i{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.25),transparent)}
.paper .section-label b{font-family:var(--px);font-size:12px;color:#a9a4b5;font-weight:500;border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:1px 8px}
.paper .section-label.overdue{color:#f6b4c2}
/* folder cards */
.paper .card{position:relative;background:var(--c-bg,#263247);border:1px solid var(--c-bd,#3e5070);border-radius:16px;padding:12px 12px 12px 12px;margin-top:10px;box-shadow:none;color:#eee6d8;transition:transform .15s,box-shadow .15s}
.paper .card::before{content:"";position:absolute;left:14px;top:-9px;width:92px;height:10px;background:var(--c-bg,#263247);border:1px solid var(--c-bd,#3e5070);border-bottom:0;border-radius:8px 14px 0 0}
.paper .card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.35),0 0 0 1px var(--c-ic,#9cc0ff)}
.paper .card.overdue{--c-bg:#3a2430;--c-bd:#6a3a4a;--c-ib:#5a2f3e;--c-ic:#f6a0b4}
.paper .card.today{--c-bg:#263247;--c-bd:#3e5070;--c-ib:#34476a;--c-ic:#a8c6ff}
.paper .card.week{--c-bg:#22383a;--c-bd:#3c5e5a;--c-ib:#2f504c;--c-ic:#8fd6bf}
.paper .card.later{--c-bg:#3a3026;--c-bd:#5e4c36;--c-ib:#54432e;--c-ic:#e8c084}
.paper .card.done{--c-bg:#2c2a44;--c-bd:#4a4670;--c-ib:#3d3a63;--c-ic:#c4b6ff;opacity:.7}
.paper .card.locked{--c-bg:#24232c;--c-bd:#3a3946;opacity:.7}
.paper .ico{width:44px;height:44px;flex:none;border-radius:12px;background:var(--c-ib,#34476a);border:1px solid rgba(255,255,255,.12);display:grid;place-items:center}
.paper .ico svg{width:22px;height:22px;fill:none;stroke:var(--c-ic,#a8c6ff);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.paper .card .t{color:#f4ecdc;font-weight:700;font-size:16px}
.paper .card .m{color:#b9b2c4}
.paper .card .when{color:#d8d0e2;font-weight:500}
.paper .card.overdue .when{color:#f6b4c2}
.paper .tag{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#d8d0e2;border-radius:20px;padding:1px 8px;font-family:var(--px);font-weight:500}
.paper .tag.overdue{background:#a8323f;border-color:#c94a58;color:#fff}
.paper .tag.new{background:var(--gold);border-color:#ffe2a0;color:#2a1a08;animation:pulse3 1.2s steps(2) infinite}
@keyframes pulse3{50%{box-shadow:0 0 10px 2px rgba(242,192,99,.7)}}
.paper .tag.ok{background:#2f6a4a;border-color:#4f9a6e;color:#fff}
